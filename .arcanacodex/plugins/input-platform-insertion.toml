[meta]
name = "input-platform-insertion"
schema_version = 1
description = "Advisory: input.rs — вставка текста платформо-зависима, на X11 НЕ enigo.text()"

[scope]
path_globs = ["crates/arcanaglyph-core/src/input.rs"]

[rule]
type = "advisory"
on_event = "before_edit"
severity = "warn"
message = """
⌨️ input.rs — вставка распознанного текста. Механизм РАЗНЫЙ на каждой платформе,
унифицировать нельзя (проверено вживую):

- X11: буфер обмена через `arboard` + Shift+Insert. ⛔ НЕ `enigo.text()` — на X11
  он теряет символы / кириллицу. См. memory text-insertion-x11.
- Wayland: clipboard + XDG RemoteDesktop portal (Ctrl+V-симуляция), нужен грант портала.
- Windows: буфер + Ctrl+V через `enigo`.
- macOS: `enigo.text()` (единственная платформа, где он легитимен).

Правишь ветку одной платформы — не задень остальные cfg-ветки.
"""
