[meta]
name = "tauri-commands-not-dead"
schema_version = 1
description = "Advisory: commands/ — #[tauri::command] ложно-мёртвые (generate_handler!), НЕ удалять по dead_code"

[scope]
path_globs = ["crates/arcanaglyph-app/src/commands/**/*.rs"]

[rule]
type = "advisory"
on_event = "before_edit"
severity = "info"
message = """
🔌 commands/ — Tauri-команды (IPC-хендлеры). ~20 функций с `#[tauri::command]`
выглядят «мёртвыми» для dead_code-анализа: их единственный вызыватель — макрос
`tauri::generate_handler!` в main.rs, ребро через макрос граф не видит.

⛔ НЕ удалять такую функцию по сигналу dead_code_candidates / clippy dead_code без
проверки, что она НЕ зарегистрирована в `generate_handler![...]`. Удаление рабочей
команды сломает фронтенд-IPC молча. См. memory feedback_dead_code_tauri_commands_fp.
"""
