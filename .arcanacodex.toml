# .arcanacodex.toml — политика проекта ArcanaGlyph для ArcanaCodex MCP.
# Мигрировано из устаревшего .arcanacodex-arch.toml (РД-122): арх-правила теперь
# живут в секции [architecture] этого файла; старый отдельный файл больше не читается.
#
# ⚠️ Rust-ограничение (см. инструкцию daemon v0.454.0): резолвер строит import-рёбра
# только ВНУТРИ крейта (crate::/self::/super::). Межкрейтовый `use other_crate::…`
# для него external и в ребро НЕ резолвится. Поэтому прежний гейт core↔app
# (cross-crate) был бы тавтологически зелёным — здесь он заменён на осмысленные
# intra-crate инварианты внутри arcanaglyph-core.

[architecture]
# ⚠️ TOML-FOOTGUN: layer_direction ОБЯЗАН стоять ВЫШЕ всех [[architecture.*]],
# иначе TOML припишет его к последней entry и молча отбросит.
# Слои снизу вверх: dsp (leaf-примитивы) ниже STT-слоя (движки + трейт).
layer_direction = ["core_dsp", "core_stt"]

# --- Изоляция STT-бэкендов (intra-crate, рёбра резолвятся) -----------------
# gigaam и qwen3asr — параллельные реализации трейта Transcriber. Общий код идёт
# только через dsp/ + transcriber/, напрямую один в другой импортировать нельзя.
# allowed_imports — allowlist: всё, что не перечислено, запрещено.

[[architecture.modules]]
root = "crates/arcanaglyph-core/src/gigaam/**"
allowed_imports = [
    "crates/arcanaglyph-core/src/gigaam/**",      # внутри модуля (super::mel и т.д.)
    "crates/arcanaglyph-core/src/dsp/**",         # общие DSP-примитивы
    "crates/arcanaglyph-core/src/error.rs",       # ArcanaError
    "crates/arcanaglyph-core/src/transcriber/**", # трейт Transcriber
]

[[architecture.modules]]
root = "crates/arcanaglyph-core/src/qwen3asr/**"
allowed_imports = [
    "crates/arcanaglyph-core/src/qwen3asr/**",    # внутри модуля
    "crates/arcanaglyph-core/src/dsp/**",         # общие DSP-примитивы
    "crates/arcanaglyph-core/src/error.rs",       # ArcanaError
    "crates/arcanaglyph-core/src/transcriber/**", # трейт Transcriber
]

# --- Слоистость внутри core: dsp — leaf ------------------------------------
# dsp/ (Ханн-окно, STFT, preprocess) — фундамент без зависимостей от crate.
# Не должен тянуть STT-слой (движки/трейт); обратное (движок → dsp) легитимно.
[[architecture.layers]]
name = "core_dsp"
paths = ["crates/arcanaglyph-core/src/dsp/**"]

[[architecture.layers]]
name = "core_stt"
paths = [
    "crates/arcanaglyph-core/src/gigaam/**",
    "crates/arcanaglyph-core/src/qwen3asr/**",
    "crates/arcanaglyph-core/src/transcriber/**",
]

